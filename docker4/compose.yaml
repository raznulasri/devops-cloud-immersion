services:
  profile:
    image: redis
    volumes:
      - me:/data

  server:
    image: ghcr.io/infratify/arena-server

  avatar:
    image: ghcr.io/infratify/arena-avatar
    ports:
      - "8080:8080"
    environment:
      NAME: Firash
      COLOR: terqoise
      SERVER: 13.212.241.150:3000
    depends_on:
      - profile
  

  avatar2:
    image: ghcr.io/infratify/arena-avatar
    ports:
      - "8081:8080"
    environment:
      NAME: RAZNUL
      COLOR: pink
      SERVER: 13.212.241.150:3000
    depends_on:
      - profile


volumes:
  me:
