<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Card — DevOps Bootcamp 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a 60%);
      color: #e2e8f0;
    }

    .card {
      width: min(360px, 100%);
      padding: 32px;
      text-align: center;
      border-radius: 24px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      animation: fade-in 0.8s ease both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .cohort {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.5);
      }
      50% {
        box-shadow: 0 0 0 12px rgba(236, 72, 153, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .badge {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">RA</div>
    <h1>Raznul Asri</h1>
    <p class="cohort">DevOps Bootcamp 2026 · Cohort 2026</p>
    <span class="badge">DevOps Engineer</span>
  </main>
</body>
</html>
